<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="480" viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-illustration-title">
  <title id="hero-illustration-title">Cake Issues reads issues from a linter and reports them to a pull request</title>
  <defs>
    <linearGradient id="hero-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3437"/>
      <stop offset="1" stop-color="#20242a"/>
    </linearGradient>
    <linearGradient id="hero-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42a5f5"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
  </defs>

  <!-- Code editor window -->
  <g transform="translate(20,60)">
    <rect x="0" y="0" width="330" height="300" rx="14" fill="url(#hero-window)"/>
    <circle cx="24" cy="24" r="6" fill="#ff6259"/>
    <circle cx="46" cy="24" r="6" fill="#ffbe2f"/>
    <circle cx="68" cy="24" r="6" fill="#2bc840"/>

    <!-- code lines -->
    <g fill="#8b95a1">
      <rect x="24" y="52" width="90" height="8" rx="4" fill="#7e57c2"/>
      <rect x="124" y="52" width="150" height="8" rx="4"/>
      <rect x="24" y="76" width="60" height="8" rx="4" fill="#42a5f5"/>
      <rect x="94" y="76" width="190" height="8" rx="4"/>
      <rect x="44" y="100" width="220" height="8" rx="4"/>
      <rect x="44" y="124" width="130" height="8" rx="4"/>

      <!-- Line with issue -->
      <rect x="44" y="148" width="190" height="8" rx="4" fill="#ef5350"/>
      <rect x="24" y="172" width="60" height="8" rx="4" fill="#42a5f5"/>
      <rect x="94" y="172" width="130" height="8" rx="4"/>
      <rect x="24" y="196" width="240" height="8" rx="4"/>
      <rect x="24" y="220" width="150" height="8" rx="4"/>
      <rect x="24" y="244" width="200" height="8" rx="4"/>
    </g>

    <!-- Wavy underline for the flagged issue -->
    <path d="M44 162 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"
          stroke="#ef5350" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Magnifying glass highlighting the issue -->
    <g transform="translate(178,116)">
      <circle cx="0" cy="0" r="34" fill="#20242a" fill-opacity="0.4"/>
      <circle cx="-4" cy="-4" r="24" fill="none" stroke="#ffb300" stroke-width="6"/>
      <line x1="14" y1="14" x2="30" y2="30" stroke="#ffb300" stroke-width="7" stroke-linecap="round"/>
      <path d="M-14 -4 a10 10 0 0 1 10 -10" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Flow arrow -->
  <path d="M366 190 C 400 190, 400 230, 434 230" stroke="url(#hero-arrow)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M424 222 L 436 230 L 424 238" stroke="#7e57c2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pull request card -->
  <g transform="translate(432,60)">
    <rect x="0" y="0" width="188" height="300" rx="14" fill="#ffffff" stroke="#dbe1e8" stroke-width="1.5"/>

    <!-- header -->
    <circle cx="26" cy="30" r="12" fill="#42a5f5"/>
    <rect x="46" y="24" width="110" height="8" rx="4" fill="#c7ced6"/>
    <rect x="46" y="38" width="70" height="6" rx="3" fill="#dbe1e8"/>
    <line x1="0" y1="58" x2="188" y2="58" stroke="#eef1f4" stroke-width="2"/>

    <!-- comment bubble 1: issue found -->
    <g transform="translate(18,74)">
      <rect x="0" y="0" width="152" height="62" rx="10" fill="#fdecea"/>
      <circle cx="16" cy="18" r="7" fill="#ef5350"/>
      <path d="M13 18 l2 2 l4 -5" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="12" width="108" height="6" rx="3" fill="#e39490"/>
      <rect x="30" y="24" width="80" height="6" rx="3" fill="#eab5b2"/>
      <rect x="16" y="42" width="122" height="6" rx="3" fill="#eab5b2"/>
    </g>

    <!-- comment bubble 2: resolved -->
    <g transform="translate(18,150)">
      <rect x="0" y="0" width="152" height="46" rx="10" fill="#e8f6ec"/>
      <circle cx="16" cy="23" r="7" fill="#2e9e4d"/>
      <path d="M12 23 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="17" width="100" height="6" rx="3" fill="#8fcf9f"/>
      <rect x="30" y="29" width="70" height="6" rx="3" fill="#b7e1c1"/>
    </g>

    <!-- status footer -->
    <g transform="translate(18,214)">
      <rect x="0" y="0" width="152" height="34" rx="8" fill="#eef1f4"/>
      <circle cx="18" cy="17" r="8" fill="#7e57c2"/>
      <path d="M14 17 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="12" width="100" height="7" rx="3.5" fill="#c7ced6"/>
    </g>

    <rect x="18" y="262" width="152" height="10" rx="5" fill="#eef1f4"/>
    <rect x="18" y="278" width="96" height="10" rx="5" fill="#eef1f4"/>
  </g>
</svg>
