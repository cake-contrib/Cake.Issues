<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title description">
  <title id="title">Grouped console diagnostics with summaries</title>
  <desc id="description">A terminal preview of a grouped warning diagnostic followed by issue summaries by provider and priority.</desc>
  <rect width="1000" height="510" rx="12" fill="#111827"/>
  <rect width="1000" height="38" rx="12" fill="#1f2937"/>
  <circle cx="22" cy="19" r="6" fill="#f87171"/>
  <circle cx="44" cy="19" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="19" r="6" fill="#34d399"/>
  <text x="500" y="24" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="13">Build output</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="14">
    <text x="28" y="75" fill="#fbbf24">┌─[CS0168]</text>
    <text x="28" y="99" fill="#9ca3af">│</text>
    <text x="28" y="123" fill="#9ca3af">12 │</text>
    <text x="76" y="123" fill="#e5e7eb">int unusedValue = 42;</text>
    <text x="28" y="147" fill="#9ca3af">   ·</text>
    <text x="76" y="147" fill="#fbbf24">    ┬</text>
    <text x="28" y="171" fill="#9ca3af">   ·</text>
    <text x="76" y="171" fill="#fbbf24">    ╰ The variable 'unusedValue' is declared but never used</text>
    <text x="28" y="195" fill="#9ca3af">│</text>
    <text x="28" y="219" fill="#9ca3af">└─</text>
    <text x="28" y="258" fill="#9ca3af">────────────────────────────────────────────────────────────────────────────</text>
    <text x="500" y="286" text-anchor="middle" fill="#f9fafb" font-weight="700">Summary</text>
    <text x="500" y="318" text-anchor="middle" fill="#f9fafb" font-weight="700">Issues per provider &amp; run</text>
    <text x="70" y="350" fill="#d1d5db">MSBuild</text>
    <rect x="160" y="337" width="192" height="18" rx="3" fill="#38bdf8"/>
    <text x="365" y="351" fill="#d1d5db">3</text>
    <text x="500" y="390" text-anchor="middle" fill="#f9fafb" font-weight="700">Issues per priority</text>
  </g>
  <rect x="105" y="408" width="790" height="70" rx="6" fill="#1f2937" stroke="#4b5563"/>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5e7eb">
    <text x="126" y="433">Issue Provider / Run</text>
    <text x="492" y="433">Number Of Issues</text>
    <text x="126" y="459">MSBuild</text>
    <text x="492" y="459"><tspan fill="#f87171">Errors  1</tspan><tspan dx="22" fill="#fbbf24">Warnings  2</tspan></text>
  </g>
</svg>
