<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title description">
  <title id="title">Compact grouped console diagnostics</title>
  <desc id="description">A compact terminal preview showing two issues grouped under the same warning rule.</desc>
  <rect width="1000" height="260" rx="12" fill="#111827"/>
  <rect width="1000" height="38" rx="12" fill="#1f2937"/>
  <circle cx="22" cy="19" r="6" fill="#f87171"/>
  <circle cx="44" cy="19" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="19" r="6" fill="#34d399"/>
  <text x="500" y="24" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="13">Build output</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="14">
    <text x="28" y="78" fill="#fbbf24">┌─[CS0168]</text>
    <text x="28" y="104" fill="#9ca3af">12 │</text>
    <text x="76" y="104" fill="#e5e7eb">int unusedValue = 42;</text>
    <text x="28" y="128" fill="#fbbf24">   ·     ╰ The variable 'unusedValue' is declared but never used</text>
    <text x="28" y="158" fill="#9ca3af">18 │</text>
    <text x="76" y="158" fill="#e5e7eb">string unusedName = "example";</text>
    <text x="28" y="182" fill="#fbbf24">   ·        ╰ The variable 'unusedName' is declared but never used</text>
    <text x="28" y="208" fill="#9ca3af">└─</text>
  </g>
</svg>
