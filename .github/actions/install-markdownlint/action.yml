name: 'InstallMarkdownlintAction'
description: 'Install Markdownlint'
runs:
  using: "composite"
  steps:
    - name: Install NodeJs
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    - name: Install markdownlint
      run: |
        npm install -g markdownlint-cli@0.46.0
      shell: bash
