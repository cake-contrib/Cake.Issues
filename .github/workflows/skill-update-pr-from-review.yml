name: Skill Update PR from Review

on:
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write

jobs:
  create-skill-update-pr:
    name: Create skill update PR
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Apply requested skill update
        id: skill_update
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import uuid
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          comment = event.get("comment", {})
          body = (comment.get("body") or "").strip()
          association = comment.get("author_association") or ""
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          def write_output(key: str, value: str) -> None:
              delimiter = f"EOF_{uuid.uuid4().hex}"
              with output_path.open("a", encoding="utf-8") as output_file:
                  output_file.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")

          allowed_associations = {"OWNER", "MEMBER", "COLLABORATOR"}
          if association not in allowed_associations:
              write_output("changed", "false")
              write_output("reason", "unauthorized")
              raise SystemExit(0)

          command_match = re.match(
              r"(?is)^/skill-update\s+([a-z0-9._-]+)\s*:\s*(.+)$",
              body,
          )
          if not command_match:
              write_output("changed", "false")
              write_output("reason", "no-command")
              raise SystemExit(0)

          skill_name = command_match.group(1).strip()
          guidance = command_match.group(2).strip()
          skill_path = Path(f".github/skills/{skill_name}/SKILL.md")

          if not skill_path.exists() or not guidance:
              write_output("changed", "false")
              write_output("reason", "invalid-skill-or-guidance")
              raise SystemExit(0)

          entry = f"- {guidance}"
          content = skill_path.read_text(encoding="utf-8").rstrip()
          section_heading = "## Review-derived guidance"
          section_match = re.search(
              r"(?ms)^## Review-derived guidance\s*(.*?)(?=^##\s|\Z)",
              content,
          )
          if section_match:
              existing_entries = {
                  line.strip()
                  for line in section_match.group(1).splitlines()
                  if line.strip().startswith("- ")
              }
              if entry in existing_entries:
                  write_output("changed", "false")
                  write_output("reason", "duplicate")
                  raise SystemExit(0)

          if section_heading not in content:
              content = f"{content}\n\n{section_heading}\n\n{entry}\n"
          else:
              section_start = content.index(section_heading)
              section_content_start = section_start + len(section_heading)
              section_remainder = content[section_content_start:]
              next_heading_match = re.search(r"\n##\s+", section_remainder)

              if next_heading_match:
                  insert_at = section_content_start + next_heading_match.start()
                  before = content[:insert_at].rstrip()
                  after = content[insert_at:].lstrip("\n")
                  content = f"{before}\n{entry}\n\n{after}"
              else:
                  content = f"{content.rstrip()}\n{entry}\n"

          skill_path.write_text(content, encoding="utf-8")

          write_output("changed", "true")
          write_output("skill_name", skill_name)
          PY

      - name: Create pull request
        if: steps.skill_update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/skill-update-${{ steps.skill_update.outputs.skill_name }}-${{ github.event.comment.id }}
          delete-branch: true
          title: Update ${{ steps.skill_update.outputs.skill_name }} skill from review feedback
          commit-message: Update ${{ steps.skill_update.outputs.skill_name }} skill from review feedback
          body: |
            This PR was created automatically from a review comment command.

            - Source comment: ${{ github.event.comment.html_url }}
            - Skill: `${{ steps.skill_update.outputs.skill_name }}`
