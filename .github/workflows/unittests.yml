name: Unit tests

# Workflow Trigger
on:
  # Trigger the workflow on a pull request to any branch, ignoring changes to /docs
  pull_request:
    paths-ignore:
      - 'docs/**'
  # Trigger the workflow on pushes to the master branch, ignoring changes to /docs
  push:
    branches: 
      - master
    paths-ignore:
      - 'docs/**'

jobs:
  Test:
    name: Run unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [
          windows-2022, windows-2025, 
          ubuntu-22.04, ubuntu-24.04,
          macos-14, macos-15
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create local branch for GitVersion
        if: github.event_name == 'pull_request'
        run: git checkout -b ${{ github.head_ref }}
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: | 
            8.x
            9.x
            10.x
      - name: Test
        run: ./build.sh --target=Test
        shell: bash