name: Publish Release Docs 

# Workflow Trigger
on:
  # Triggers the workflow in the event there is a release created
  release:
    types: [published]
  # Allow manual triggering of the workflow.
  # This will deploy current development branch as latest version.
  workflow_dispatch:

permissions:
  contents: write

# Both documentation publishers write to gh-pages, regardless of source ref.
concurrency:
  group: publish-docs-gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Build & Publish Docs
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2
      - name: Install Python Dependencies
        run: pip install -r requirements.txt
        working-directory: ./docs
      - name: Install Required Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant
      - name: Configure Git
        run: |
          git config --global user.name "Build Server"
          git config --global user.email "ci@cakeissues.net"
      # Determine the version (either from the release or manually inputted)
      - name: Set version to deploy
        id: set-version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "No latest release found" >&2
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          if [[ "$EVENT_NAME" == "release" ]]; then
            echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "VERSION=$LATEST_TAG" >> "$GITHUB_ENV"
          else
            echo "No version specified, cannot deploy." >&2
            exit 1
          fi
      - name: Build & Publish
        run: |
          if [[ "$VERSION" == "$LATEST_TAG" ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
          else
            mike deploy --push "$VERSION"
          fi
        working-directory: ./docs
